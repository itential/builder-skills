version: 2
updates:
  # Keeps the commit-SHA pins on GitHub Actions current: one grouped PR a week.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
    # Minor and patch updates only. A major version can change behavior that CI here
    # doesn't exercise (Release Drafter only runs on main), so take those on purpose.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "chore"
    labels: ["chore", "skip-changelog"]
