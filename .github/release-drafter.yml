name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'

categories:
  - title: '🚀 Features'
    labels: ['feature']
  - title: '🐛 Bug Fixes'
    labels: ['fix']
  - title: '🧰 Refactoring'
    labels: ['refactor']
  - title: '🧹 Chores'
    labels: ['chore']
  - title: '📝 Documentation'
    labels: ['documentation']

change-template: '- $TITLE (#$NUMBER)'
change-title-escapes: '\<*_&'

# docs/ and chore/ branches are auto-labeled with skip-changelog by pr-labeler.yml and
# left out of the release notes. The version comes from plugin.json (release-drafter.yml).
exclude-labels:
  - 'skip-changelog'

template: |
  ## Changes

  $CHANGES
