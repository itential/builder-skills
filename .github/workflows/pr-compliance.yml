name: PR Compliance

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
    branches: [main]

jobs:
  branch-naming:
    name: Branch Naming
    if: github.repository == 'itential/builder-skills'
    runs-on: ubuntu-latest
    steps:
      - name: Validate branch name
        env:
          BRANCH_NAME: ${{ github.head_ref }}
        run: |
          branch="$BRANCH_NAME"
          pattern="^(feature|fix|refactor|docs|chore)/[a-z][a-z0-9-]*$"
          if [[ ! "$branch" =~ $pattern ]]; then
            echo "::error::Branch '$branch' does not follow naming conventions."
            echo ""
            echo "Required format: <type>/<description>"
            echo "Valid types:     feature, fix, refactor, docs, chore"
            echo "Description:     lowercase letters, numbers, and hyphens only"
            echo "Example:         feature/add-auth-middleware"
            exit 1
          fi
          echo "Branch name '$branch' is valid."

  skills-valid:
    name: Skills Valid
    if: github.repository == 'itential/builder-skills'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Skills follow the Agent Skills format, references resolve, bundled assets are current
        run: scripts/check-generated.sh
      - name: Install offline regression dependencies
        run: python3 -m pip install -r tests/requirements.txt
      - name: Native agent-tool schema and distribution regressions
        run: python3 -m unittest discover -s tests -v

  manifest-versions:
    name: Manifest Versions
    if: github.repository == 'itential/builder-skills'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check every plugin manifest carries the same version
        run: python3 scripts/bump_version.py --check
