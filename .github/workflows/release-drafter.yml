name: Release Drafter

# Maintains a draft GitHub Release that accumulates notes from merged PRs (grouped by the
# labels pr-labeler.yml applies). The draft's version is the one in plugin.json, so the
# release tag always matches the plugin version. Publishing the release (and its tag) is
# a manual step -- see CONTRIBUTING.md -> Releasing.

on:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  update-draft-release:
    name: Update draft release
    if: github.repository == 'itential/builder-skills'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read the plugin version
        id: manifest
        run: echo "version=$(jq -r .version plugin.json)" >> "$GITHUB_OUTPUT"
      - uses: release-drafter/release-drafter@d1a19e60e81a7e650d00a7de9277f87e439117ea # v7.11.0
        with:
          version: ${{ steps.manifest.outputs.version }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
