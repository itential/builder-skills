name: Release Drafter

# Maintains a draft GitHub Release that accumulates notes from merged PRs (grouped by the
# labels pr-labeler.yml applies). The draft's version is the one in plugin.json, so the
# release tag always matches the plugin version. Publishing the release (and its tag) is
# a manual step -- see CONTRIBUTING.md -> Releasing.

on:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  update-draft-release:
    name: Update draft release
    if: github.repository == 'itential/builder-skills'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
      - name: Read the plugin version
        id: manifest
        run: echo "version=$(jq -r .version plugin.json)" >> "$GITHUB_OUTPUT"
      - uses: release-drafter/release-drafter@v6
        with:
          version: ${{ steps.manifest.outputs.version }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
