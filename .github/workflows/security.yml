name: Security

# Skill instructions and scripts against this repo's security rules, and the workflows
# themselves with zizmor. See CONTRIBUTING.md -> Security checks.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  security-rules:
    name: Security Rules
    if: github.repository == 'itential/builder-skills'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Skills and scripts follow the security rules
        run: python3 scripts/check-security-rules.py

  workflow-security:
    name: Workflow Security
    if: github.repository == 'itential/builder-skills'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Audit the GitHub Actions workflows (zizmor)
        env:
          GH_TOKEN: ${{ github.token }}
        run: pipx run zizmor==1.33.1 --format=github .github/workflows
