name: Version Bump

# Deliberately dumb: bumps the PATCH version by 1 on every merge to main, no exceptions,
# no categorization by label or PR type. Every merge ships as a patch release of
# .claude-plugin/plugin.json and marketplace.json. If you want a minor/major bump for a
# real feature or breaking change, edit the version by hand in that PR instead — this
# workflow only ever adds 0.0.1.
#
# Opens a PR rather than pushing to main directly (confirmed live: a direct push was
# rejected by branch protection — GH006, unsigned commit + no PR + status checks that
# never ran on a bare push). Going through a PR is what makes it land: status checks run
# normally, and the eventual squash-merge is signed by GitHub itself.
#
# TOKEN NOTE: the default GITHUB_TOKEN works for opening the PR, but GitHub blocks
# GITHUB_TOKEN-authored events from triggering other workflows (anti-recursion
# protection), so pr-compliance.yml/pr-labeler.yml won't fire on it automatically —
# its required status checks stay pending until someone pushes a trivial commit to
# nudge them. Set a repo secret VERSION_BUMP_TOKEN (fine-grained PAT, contents +
# pull-requests write) to avoid that; a PAT's events trigger other workflows normally.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  bump-version:
    name: Bump patch version
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, 'chore: bump version to')"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.VERSION_BUMP_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Bump patch version, commit, and open a PR
        env:
          GH_TOKEN: ${{ secrets.VERSION_BUMP_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          new_version=$(python3 scripts/bump_version.py --bump patch)
          branch="chore/bump-version-to-${new_version//./-}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add .claude-plugin/plugin.json .claude-plugin/marketplace.json
          git commit -m "chore: bump version to v${new_version}"
          git push origin "$branch"

          gh pr create \
            --title "chore: bump version to v${new_version}" \
            --body "Automatic patch bump — every merge to main gets one, no categorization. Merging this releases v${new_version}." \
            --base main \
            --head "$branch" \
            --label chore \
            --label skip-changelog
