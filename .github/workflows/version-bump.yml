name: Version Bump

# After a PR merges to main, opens a PR bumping .claude-plugin/plugin.json and
# marketplace.json to stay in sync with the version Release Drafter will resolve for
# the next release.
#
# Bump size comes from the merged PR's labels (applied by pr-labeler.yml, or manually
# for breaking-change):
#   breaking-change / breaking -> major
#   feature                    -> minor
#   fix / refactor             -> patch
#   documentation / chore / skip-changelog / no matching label -> no bump
#
# WHY THIS OPENS A PR INSTEAD OF PUSHING TO MAIN DIRECTLY (confirmed live, not assumed):
# an earlier version of this workflow pushed the bump commit straight to main and was
# rejected by GH006 with three separate violations: commits must be signed, changes must
# go through a pull request, and required status checks never ran on a bare push. No
# branch-protection bypass allowance fixes this — a raw `git push` can never satisfy
# "status checks must run" (Branch Naming/Commit Messages only trigger on `pull_request`
# events) or produce a GitHub-verified signature the way GitHub's own merge button does.
# Going through a real PR is what makes this actually work: status checks run normally,
# and the eventual squash-merge is signed by GitHub itself, exactly like every other
# change in this repo.
#
# TOKEN NOTE: pushing the new branch and opening the PR with the default GITHUB_TOKEN
# works, but GitHub deliberately does not let GITHUB_TOKEN-authored events trigger other
# workflows (anti-recursion protection) — so pr-compliance.yml and pr-labeler.yml likely
# won't fire on the resulting PR, leaving its required status checks permanently
# "expected but never reported" until someone pushes a trivial commit to it manually. To
# avoid that, set a repo secret VERSION_BUMP_TOKEN to a PAT (fine-grained, contents +
# pull-requests write on this repo) — a PAT's events DO trigger other workflows normally.
# Falls back to GITHUB_TOKEN if that secret isn't set, in which case the manual nudge
# described above is the workaround.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  bump-version:
    name: Bump plugin version
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, 'chore: bump version to')"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.VERSION_BUMP_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Determine merged PR number
        id: pr
        run: |
          number=$(git log -1 --format=%s | grep -oP '\(#\K[0-9]+(?=\)$)' || true)
          if [[ -z "$number" ]]; then
            echo "No PR number found in commit subject — not a squash-merged PR, skipping."
            echo "number=" >> "$GITHUB_OUTPUT"
          else
            echo "number=$number" >> "$GITHUB_OUTPUT"
          fi

      - name: Determine bump type from PR labels
        id: bump
        if: steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          labels=$(gh pr view "${{ steps.pr.outputs.number }}" --repo "${{ github.repository }}" --json labels --jq '.labels[].name')
          echo "PR labels: $labels"

          if grep -qE '^(breaking|breaking-change)$' <<< "$labels"; then
            echo "type=major" >> "$GITHUB_OUTPUT"
          elif grep -qE '^skip-changelog$' <<< "$labels"; then
            echo "type=" >> "$GITHUB_OUTPUT"
          elif grep -qE '^feature$' <<< "$labels"; then
            echo "type=minor" >> "$GITHUB_OUTPUT"
          elif grep -qE '^(fix|refactor)$' <<< "$labels"; then
            echo "type=patch" >> "$GITHUB_OUTPUT"
          else
            echo "No version-impacting label found — skipping bump."
            echo "type=" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump manifest files, commit, and open a PR
        if: steps.bump.outputs.type != ''
        env:
          GH_TOKEN: ${{ secrets.VERSION_BUMP_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          new_version=$(python3 scripts/bump_version.py --bump "${{ steps.bump.outputs.type }}")
          branch="chore/bump-version-to-${new_version//./-}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add .claude-plugin/plugin.json .claude-plugin/marketplace.json
          git commit -m "chore: bump version to v${new_version}"
          git push origin "$branch"

          gh pr create \
            --title "chore: bump version to v${new_version}" \
            --body "Automated version bump, triggered by #${{ steps.pr.outputs.number }} (resolved to a **${{ steps.bump.outputs.type }}** bump). Merging this releases v${new_version} — see \`.github/workflows/version-bump.yml\` for how the bump size was determined." \
            --base main \
            --head "$branch" \
            --label chore \
            --label skip-changelog
